<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroTech — Sign In & Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 32px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }
    .auth-title {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #334155;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    input:focus {
      border-color: #38bdf8;
    }
    .submit-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      font-size: 14px;
      transition: background 0.2s ease;
    }
    .submit-btn:hover {
      background: #1d4ed8;
    }
    .submit-btn.register-btn {
      background: #10b981;
    }
    .submit-btn.register-btn:hover {
      background: #059669;
    }
    .msg-box {
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      line-height: 1.4;
    }
    .msg-box.error {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
    }
    .msg-box.success {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #065f46;
    }
    .demo-creds {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #334155;
      padding-top: 14px;
      line-height: 1.6;
    }
    .demo-creds code {
      color: #93c5fd;
      background: #0f172a;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 11px;
    }
    .back-store {
      text-align: center;
      margin-top: 14px;
    }
    .back-store a {
      color: #94a3b8;
      font-size: 12px;
      text-decoration: none;
    }
    .back-store a:hover {
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-title">⚡ ElectroTech Account</div>

    <div class="tabs">
      <button class="tab-btn active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" id="tabSignUp" onclick="switchTab('signup')">Register</button>
    </div>

    <div id="statusMsg" class="msg-box"></div>

    <!-- SIGN IN -->
    <form id="signInForm">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="admin@store.com or john@example.com">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required placeholder="Enter password">
      </div>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <!-- REGISTER (Locked to Customer) -->
    <form id="signUpForm" style="display: none;">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" required placeholder="Alex Morgan">
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" required placeholder="alex@example.com">
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" required placeholder="Create a password">
      </div>
      <button type="submit" class="submit-btn register-btn">Create Buyer Account</button>
    </form>

    <div class="back-store">
      <a href="/">← Return to Storefront</a>
    </div>

    <div class="demo-creds">
      <strong>Preset Demo Accounts:</strong><br>
      • <strong>Admin:</strong> <code>admin@store.com</code> / <code>admin123</code><br>
      • <strong>Customer:</strong> <code>john@example.com</code> / <code>user123</code>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const isSignIn = tab === 'signin';
      document.getElementById('signInForm').style.display = isSignIn ? 'block' : 'none';
      document.getElementById('signUpForm').style.display = isSignIn ? 'none' : 'block';
      document.getElementById('tabSignIn').classList.toggle('active', isSignIn);
      document.getElementById('tabSignUp').classList.toggle('active', !isSignIn);
      hideMessage();
    }

    function showMessage(text, isError = true) {
      const box = document.getElementById("statusMsg");
      box.textContent = text;
      box.className = `msg-box ${isError ? 'error' : 'success'}`;
      box.style.display = "block";
    }

    function hideMessage() {
      document.getElementById("statusMsg").style.display = "none";
    }

    function redirectUser(user) {
      localStorage.setItem("user", JSON.stringify(user));
      if (user.role === "admin") {
        window.location.href = "/admin.html";
      } else {
        window.location.href = "/store.html";
      }
    }

    // Sign In handler
    document.getElementById("signInForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessage();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          redirectUser(data.user);
        } else {
          showMessage(data.message || "Invalid credentials.");
        }
      } catch (err) {
        showMessage("Failed to connect to authentication server.");
      }
    });

    // Registration handler (Role implicitly defaults to 'user' on backend)
    document.getElementById("signUpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessage();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (data.success) {
          showMessage("Account created successfully! Redirecting...", false);
          setTimeout(() => redirectUser(data.user), 900);
        } else {
          showMessage(data.message || "Registration failed.");
        }
      } catch (err) {
        showMessage("Server connection error during registration.");
      }
    });
  </script>
</body>
</html>
