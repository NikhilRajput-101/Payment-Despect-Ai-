<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ElectroTech — Developer Hardware Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    
    .navbar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 16px 36px; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100; }
    .brand { font-size: 22px; font-weight: 800; color: #38bdf8; }
    .nav-actions { display: flex; align-items: center; gap: 14px; }
    .nav-btn { background: #334155; color: #f8fafc; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 13px; }
    .nav-btn:hover { background: #475569; }
    .cart-btn { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .cart-badge { background: #ef4444; color: white; border-radius: 999px; padding: 2px 7px; font-size: 11px; margin-left: 6px; }

    .hero { text-align: center; padding: 48px 20px 20px; }
    .hero h1 { font-size: 36px; margin-bottom: 8px; }
    .hero p { color: #94a3b8; font-size: 15px; }

    .grid { max-width: 1180px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card-icon { height: 140px; background: #0b1329; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .card-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #94a3b8; line-height: 1.4; margin-bottom: 16px; flex-grow: 1; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 20px; font-weight: 800; color: #38bdf8; }
    .btn-add { background: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-add:hover { background: #059669; }

    /* Cart Slider */
    .cart-modal { position: fixed; right: -420px; top: 0; width: 400px; height: 100vh; background: #1e293b; border-left: 1px solid #334155; box-shadow: -10px 0 30px rgba(0,0,0,0.5); transition: right 0.3s ease; padding: 24px; z-index: 200; display: flex; flex-direction: column; }
    .cart-modal.open { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 14px; }
    .cart-items { flex-grow: 1; overflow-y: auto; margin: 16px 0; }
    .cart-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .checkout-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .checkout-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">⚡ ElectroTech</div>
    <div class="nav-actions">
      <span id="userGreeting" style="font-size: 13px; color: #94a3b8;"></span>
      <a href="/login.html" id="authBtn" class="nav-btn">Sign In</a>
      <a href="/admin.html" id="adminLink" class="nav-btn" style="display:none; background:#7c3aed;">🛡️ AI Copilot</a>
      <button class="cart-btn" onclick="toggleCart()">🛒 Cart <span class="cart-badge" id="cartCount">0</span></button>
    </div>
  </nav>

  <div class="hero">
    <h1>Developer Hardware Store</h1>
    <p>Purchase gear via PayPal Sandbox to test fraud detection and delivery tracking.</p>
  </div>

  <div class="grid" id="productGrid"></div>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button onclick="toggleCart()" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div class="cart-items" id="cartItems"><p style="color:#64748b; text-align:center; margin-top:40px;">Cart is empty.</p></div>
    <div style="border-top:1px solid #334155; padding-top:14px;">
      <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:12px;">
        <span>Total:</span>
        <span id="cartTotal" style="color:#38bdf8;">$0.00 USD</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </div>

  <script>
    const products = [
      { id: "P1", name: "Mechanical Gaming Keyboard", icon: "⌨️", price: 5.00, desc: "RGB Backlit, Hot-Swappable Blue Switches." },
      { id: "P2", name: "Precision Wireless Mouse", icon: "🖱️", price: 3.50, desc: "26,000 DPI Optical Sensor, 58g Lightweight." },
      { id: "P3", name: "ANC Studio Headphones", icon: "🎧", price: 6.00, desc: "Active Noise Cancellation, 40h Battery Life." },
      { id: "P4", name: "4K Pro Streaming Webcam", icon: "📷", price: 4.50, desc: "Ultra HD 60fps with Dual Noise-Canceling Mics." },
      { id: "P5", name: "Aluminum Laptop Stand", icon: "💻", price: 2.50, desc: "Ergonomic Heat Dissipation with Dual Rotation." },
      { id: "P6", name: "USB-C Dual 4K Docking Station", icon: "🔌", price: 5.50, desc: "100W Power Delivery with Gigabit Ethernet." }
    ];

    let cart = [];
    const user = JSON.parse(localStorage.getItem("user") || "null");

    if (user) {
      document.getElementById("userGreeting").textContent = `Welcome, ${user.name}`;
      const btn = document.getElementById("authBtn");
      btn.textContent = "Sign Out";
      btn.href = "#";
      btn.onclick = () => { localStorage.removeItem("user"); window.location.reload(); };
      if (user.role === "admin") document.getElementById("adminLink").style.display = "inline-block";
    }

    const grid = document.getElementById("productGrid");
    grid.innerHTML = products.map(p => `
      <div class="card">
        <div class="card-icon">${p.icon}</div>
        <div class="card-body">
          <div class="card-title">${p.name}</div>
          <div class="card-desc">${p.desc}</div>
          <div class="card-footer">
            <span class="price">$${p.price.toFixed(2)}</span>
            <button class="btn-add" onclick="add('${p.id}')">+ Add to Cart</button>
          </div>
        </div>
      </div>
    `).join("");

    function add(id) {
      cart.push(products.find(p => p.id === id));
      updateCart();
      document.getElementById("cartModal").classList.add("open");
    }

    function toggleCart() {
      document.getElementById("cartModal").classList.toggle("open");
    }

    function updateCart() {
      document.getElementById("cartCount").textContent = cart.length;
      const b = document.getElementById("cartItems");
      if (cart.length === 0) {
        b.innerHTML = `<p style="color:#64748b; text-align:center; margin-top:40px;">Cart is empty.</p>`;
        document.getElementById("cartTotal").textContent = "$0.00 USD";
        return;
      }
      let sum = 0;
      b.innerHTML = cart.map((it, idx) => {
        sum += it.price;
        return `
          <div class="cart-item">
            <div><strong>${it.name}</strong><br><span style="color:#38bdf8;">$${it.price.toFixed(2)}</span></div>
            <button onclick="cart.splice(${idx},1); updateCart();" style="background:none; border:none; color:#ef4444; cursor:pointer;">✕</button>
          </div>
        `;
      }).join("");
      document.getElementById("cartTotal").textContent = `$${sum.toFixed(2)} USD`;
    }

    function checkout() {
      if (cart.length === 0) return alert("Cart is empty!");
      localStorage.setItem("checkoutCart", JSON.stringify(cart));
      if (!user) {
        alert("Please login first to place your order.");
        window.location.href = "/login.html";
      } else {
        window.location.href = "/store.html";
      }
    }
  </script>
</body>
</html>
